# Keep npm packages and GitHub Actions on their latest releases: weekly
# grouped PRs, squash-merged once the build is green
# (.github/workflows/dependabot-auto-merge.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
